version: '3.8'
services:
  mysql:
    image: mysql:8
    command: --mysql-native-password=ON --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    volumes:
      - ./data/mysql/:/var/lib/mysql/
      - ./docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
    environment:
      TZ: Asia/Shanghai # 指定时区
      MYSQL_ROOT_PASSWORD: "123456" # 配置root用户密码
      MYSQL_DATABASE: "cool" # 业务库名
      MYSQL_USER: "cool" # 业务库用户名
      MYSQL_PASSWORD: "123123" # 业务库密码
  redis:
    image: redis
    # command: --requirepass "12345678" # redis库密码,不需要密码注释本行
    restart: always
    environment:
      TZ: Asia/Shanghai # 指定时区
    volumes:
      - ./data/redis/:/data/
  chatgpt-share-server:
    image: xyhelper/chatgpt-share-server:latest
    restart: always
    ports:
      - 8300:8001
    environment:
      TZ: Asia/Shanghai # 指定时区
      # 接入网关地址
      CHATPROXY: "https://demo.xyhelper.cn"
      # 接入网关的authkey
      AUTHKEY: "xyhelper"
      # 内容审核及速率限制
      AUDIT_LIMIT_URL: "http://auditlimit:8080/audit_limit"
      # 库文件清理服务地址(对应下方 chatgpt-file-deletion 服务)
      # 配置后可在后台使用「清理库文件」功能,留空则不启用
      LIBCLEANUPSERVER: "http://chatgpt-file-deletion:8001/gpt/library/clean/file"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data/chatgpt-share-server/:/app/data/
    labels:
      - "com.centurylinklabs.watchtower.scope=xyhelper-chatgpt-share-server"
  # 新版 Web UI(用户访问入口)
  #   基于真实 ChatGPT 页面模板渲染,自带车队列表页,无状态(登录态存浏览器 cookie)。
  #   上游直接指向本项目的 chatgpt-share-server,两边共用同一套车队/账号数据。
  #   管理后台仍在 chatgpt-share-server(8300/xyhelper),本服务只负责页面渲染与反代。
  #   完整配置项说明见 https://github.com/xyhelper/chatgpt-web-ui-deploy
  chatgpt-web-ui:
    image: ghcr.io/xyhelper/chatgpt-web-ui:latest
    restart: always
    depends_on:
      - chatgpt-share-server
    ports:
      - 8400:80
    environment:
      TZ: Asia/Shanghai # 指定时区
      PORT: "80" # web 服务监听端口,需与上面的端口映射保持一致
      # 上游 API 地址:容器内直接访问 chatgpt-share-server,不经过宿主机端口
      UPSTREAM_URL: "http://chatgpt-share-server:8001"
      RUN_MODE: "share" # 分享模式,与 chatgpt-share-server 的车队模式配套
      LOGIN_URL: "/list" # 未登录时先展示车队列表页,点击车队再进入登录
      # 自签 access token 的签名密钥,share 模式必填
      # ⚠️ 必须改成随机值。默认值等同于把密钥公开,任何人都能伪造任意账号的登录态
      #    生成方式:openssl rand -hex 32
      FAKE_TOKEN_SECRET: "change-me-to-a-random-secret"
    healthcheck:
      # /healthz 是独立探活端点,不渲染页面、不请求上游、不依赖登录态
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.scope=xyhelper-chatgpt-share-server"
  # 库文件清理服务
  #   按 accessToken 清理该账号在 ChatGPT 侧上传的库文件(附件/图片等),
  #   避免存储越用越满。由 chatgpt-share-server 通过 LIBCLEANUPSERVER 调用,
  #   POST /gpt/library/clean/file,body 为 {"accessToken":"..."}。
  #   管理页面:http://服务器IP:9900/gpt.html
  #   说明见 https://github.com/xyhelper/chatgpt-file-deletion-deploy
  #   复用上面的 redis 服务:镜像内置 config.yaml 中 redis.cool.address 即为 redis:6379
  chatgpt-file-deletion:
    image: ghcr.io/xyhelper/chatgpt-file-deletion:latest
    restart: always
    depends_on:
      - redis
    ports:
      - 9900:8001
    environment:
      TZ: Asia/Shanghai # 指定时区
      # ChatGPT 接入点地址,需与上方 chatgpt-share-server 的 CHATPROXY 保持一致
      GPTPROXY: "https://demo.xyhelper.cn"
      # 企业微信机器人 webhook 地址,留空则不发送通知
      # WEBHOOKURL: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx"
      CONCURRENCY: 1 # 账号并发数
      CLEAN_MINTUNES: 1440 # 清理该时长(分钟)之前上传的文件,必须是整数,默认 1440(24 小时)
      CLEAN_PROPORTION: 0.5 # 存储使用率超过该比例时触发清理,须为小于 1 的小数
    labels:
      - "com.centurylinklabs.watchtower.scope=xyhelper-chatgpt-share-server"
  # 内容审核与频率限制服务
  #   按「用户 token + 模型」两个维度分别限流,可选叠加内容审核,
  #   由 chatgpt-share-server 通过 AUDIT_LIMIT_URL 调用,接口为 POST /audit_limit。
  #   说明见 https://github.com/xyhelper/auditlimit
  #   限流值格式为 "次数/时间",如 "60/3h" 表示每 3 小时最多 60 次;
  #   把某个模型的值写成 DISABLED 即禁止用户使用该模型(返回 403)。
  #   模型名转配置键的规则:转为大写,并把 "." 换成 "_"
  #   (如 gpt-5.6-sol-wm → GPT-5_6-SOL-WM),下面每一项都是一个模型。
  #   未在下方单独配置的模型一律落到 DEFAULT。
  auditlimit:
    image: xyhelper/auditlimit
    restart: always
    # 只由 chatgpt-share-server 在容器网络内调用,默认不对外暴露。
    # 需要本机调试时可打开(容器内固定监听 8080,不要设置 PORT):
    #   - 127.0.0.1:9611:8080
    volumes:
      # 挂载后可用 data/auditlimit/keywords.txt 逐行配置禁止词,文件为空则该功能不启用
      - ./data/auditlimit/:/app/data/
    environment:
      TZ: Asia/Shanghai # 指定时区
      # 内容审核所用的 OpenAI key,留空则只做限流、不做审核
      # OAIKEY: "sk-xxxxxx"
      # 兜底值:未单独配置的模型都用这一项
      DEFAULT: "20/3h"
      # Auto 档(模型选择器中的「Auto」,请求带 model=auto)
      AUTO: "200/3h"
      # 研究 / 代理模式(由请求体的 system_hints 触发)
      RESEARCH: "2/24h"
      AGENT: "2/24h"
      # Pro
      GPT-5-5-PRO: "7/24h"
      GPT-5-6-PRO: "7/24h"
      GPT-6-PRO: "7/24h"
      # Thinking
      GPT-5-5-THINKING: "20/3h"
      GPT-5-6-THINKING: "20/3h"
      GPT-5-6-T-MINI: "20/3h"
      # 标准
      GPT-5-6: "60/3h"
      GPT-5-5-INSTANT: "60/3h"
      GPT-5-6-INSTANT: "60/3h"
      # 工作模式 / Codex,模型名中的 "." 在配置键里写作 "_"
      GPT-5_5-WM: "60/3h"
      GPT-5_6-SOL-WM: "60/3h"
      GPT-5_6-TERRA-WM: "60/3h"
      GPT-5_6-LUNA-WM: "60/3h"
      GPT-6-ASTRA-WM: "60/3h"
      # Codex 内部别名
      GPT-5_5: "60/3h"
      GPT-5_6-SOL: "60/3h"
      GPT-5_6-TERRA: "60/3h"
      GPT-5_6-LUNA: "60/3h"
      GPT-6-ASTRA: "60/3h"
    labels:
      - "com.centurylinklabs.watchtower.scope=xyhelper-chatgpt-share-server"
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --scope xyhelper-chatgpt-share-server --cleanup
    restart: always
    environment:
      - TZ=Asia/Shanghai
    labels:
      - "com.centurylinklabs.watchtower.scope=xyhelper-chatgpt-share-server"